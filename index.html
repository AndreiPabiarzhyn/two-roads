<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Fork</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--bg:#0D1B2A;--accent:#00E5FF;--gold:#FFD36A;--border:rgba(255,255,255,.12);--muted:rgba(255,255,255,.55)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:#fff;touch-action:none}
body{display:flex;flex-direction:column}
.lang-bar{width:100%;background:rgba(13,27,42,.92);border-bottom:1px solid var(--border);padding:6px 8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.lb{padding:2px 10px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--muted);font:700 11px var(--font);cursor:pointer}
.lb.on{background:var(--accent);border-color:var(--accent);color:#042028}
.fit{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.orbit{perspective:680px}
.phone{
  width:min(250px,62vw);aspect-ratio:9/16;background:#111;border-radius:28px;padding:8px;
  box-shadow:0 16px 36px rgba(0,0,0,.4);transform-style:preserve-3d;
}
.screen{height:100%;background:#101820;border-radius:20px;overflow:hidden;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.held{cursor:grabbing}
.arr{
  width:42px;height:42px;border:0;border-radius:14px;background:#16324a;color:var(--accent);
  font:700 18px var(--font);cursor:pointer
}
.arr:active,.arr.on{background:var(--accent);color:#042028}
.hint{font:600 12px var(--font);color:var(--muted);text-align:center;max-width:250px;min-height:16px}
</style>
</head>
<body>
<div class="lang-bar" id="langBar"></div>
<div class="fit">
  <button class="arr" id="left" type="button" aria-label="left">◀</button>
  <div class="col">
    <button class="arr" id="up" type="button" aria-label="up">▲</button>
    <div class="orbit"><div class="phone" id="phone"><div class="screen"><canvas id="cv"></canvas></div></div></div>
    <button class="arr" id="down" type="button" aria-label="down">▼</button>
    <p class="hint" id="hint"></p>
  </div>
  <button class="arr" id="right" type="button" aria-label="right">▶</button>
</div>
<script>
const T = {
  RU:{lang:'ru',dir:'ltr',maze:'Лабиринт',roll:'Кристалл',back:'Назад',peak:'Пик вышел',home:'Кристалл дома',hint:'Держи мышь на экране или жми стрелки',fork:'Две дороги'},
  EN:{lang:'en',dir:'ltr',maze:'Maze',roll:'Crystal',back:'Back',peak:'Peak is through',home:'Crystal is home',hint:'Hold on the screen or press the arrows',fork:'Two roads'},
  ES:{lang:'es',dir:'ltr',maze:'Laberinto',roll:'Cristal',back:'Atrás',peak:'Peak salió',home:'El cristal está en casa',hint:'Mantén el ratón en la pantalla o pulsa las flechas',fork:'Dos caminos'},
  ID:{lang:'id',dir:'ltr',maze:'Labirin',roll:'Kristal',back:'Kembali',peak:'Pik sampai',home:'Kristal sudah di sarang',hint:'Tahan di layar atau tekan panah',fork:'Dua jalan'},
  IT:{lang:'it',dir:'ltr',maze:'Labirinto',roll:'Cristallo',back:'Indietro',peak:'Peak è passato',home:'Il cristallo è a casa',hint:'Tieni il mouse sullo schermo o premi le frecce',fork:'Due strade'},
  TR:{lang:'tr',dir:'ltr',maze:'Labirent',roll:'Kristal',back:'Geri',peak:'Peak geçti',home:'Kristal yuvada',hint:'Ekranda tut veya oklara bas',fork:'İki yol'},
  PL:{lang:'pl',dir:'ltr',maze:'Labirynt',roll:'Kryształ',back:'Wstecz',peak:'Peak przeszedł',home:'Kryształ w gnieździe',hint:'Przytrzymaj na ekranie albo naciśnij strzałki',fork:'Dwie drogi'},
  PT:{lang:'pt',dir:'ltr',maze:'Labirinto',roll:'Cristal',back:'Voltar',peak:'Peak passou',home:'O cristal está em casa',hint:'Segura no ecrã ou carrega nas setas',fork:'Duas estradas'},
  AR:{lang:'ar',dir:'rtl',maze:'متاهة',roll:'بلورة',back:'رجوع',peak:'وصل بيك',home:'البلورة في العش',hint:'أبقِ المؤشر على الشاشة أو اضغط الأسهم',fork:'طريقان'}
};
const LANGS = ['RU','EN','ES','ID','IT','TR','PL','PT','AR'];
let lang = 'EN';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const phone = document.getElementById('phone');
const CW = 260, CH = 420;
cv.width = CW; cv.height = CH;

const MAZE_WALLS = [
  {x:0,y:300,w:165,h:16},
  {x:95,y:200,w:165,h:16},
  {x:0,y:105,w:155,h:16}
];
let mode = 'fork';
let tiltX = 0, tiltY = 0;
let drag = false;
let arrow = null;
let peak = {x:190,y:370,r:12};
let gem = {x:130,y:24,r:11};
const nest = {x:130,y:360,r:26};
const rocks = [
  {x:40,y:140,r:16,v:1.5},
  {x:190,y:240,r:16,v:-1.2}
];
let winLine = '';

function setLang(code) {
  lang = code;
  document.documentElement.lang = T[code].lang;
  document.documentElement.dir = T[code].dir;
  document.getElementById('langBar').innerHTML = LANGS.map(item =>
    `<button class="lb${item===code?' on':''}" type="button" onclick="setLang('${item}')">${item}</button>`
  ).join('');
  document.getElementById('hint').textContent = mode === 'fork' ? '' : T[code].hint;
}
setLang('EN');

function resetMaze() { peak = {x:190,y:370,r:12}; }
function resetRoll() { gem = {x:130,y:24,r:11}; rocks[0].x = 40; rocks[1].x = 190; }

function hitRect(x, y, r, w) {
  return x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h;
}

function moveBody(body, walls) {
  const nx = Math.max(body.r, Math.min(CW - body.r, body.x + tiltX * 2.6));
  const ny = Math.max(body.r, Math.min(CH - body.r, body.y + tiltY * 2.6));
  if (!walls.some(w => hitRect(nx, body.y, body.r, w))) body.x = nx;
  if (!walls.some(w => hitRect(body.x, ny, body.r, w))) body.y = ny;
}

function step() {
  if (mode === 'maze') {
    moveBody(peak, MAZE_WALLS);
    if (Math.hypot(peak.x - 42, peak.y - 42) < 24) { winLine = T[lang].peak; mode = 'win'; }
  }
  if (mode === 'roll') {
    rocks.forEach(rock => {
      rock.x += rock.v;
      if (rock.x < rock.r || rock.x > CW - rock.r) rock.v *= -1;
    });
    moveBody(gem, []);
    rocks.forEach(rock => {
      const dx = gem.x - rock.x, dy = gem.y - rock.y;
      if (Math.hypot(dx, dy) < gem.r + rock.r) {
        gem.x += dx >= 0 ? 22 : -22;
        gem.y += dy >= 0 ? 16 : -16;
        gem.x = Math.max(gem.r, Math.min(CW - gem.r, gem.x));
        gem.y = Math.max(gem.r, Math.min(CH - gem.r, gem.y));
      }
    });
    if (Math.hypot(gem.x - nest.x, gem.y - nest.y) < nest.r - 4) { winLine = T[lang].home; mode = 'win'; }
  }
  phone.style.transform = `rotateX(${(-tiltY * 16).toFixed(2)}deg) rotateY(${(tiltX * 16).toFixed(2)}deg)`;
  document.getElementById('hint').textContent = mode === 'fork' || mode === 'win' ? '' : T[lang].hint;
  draw();
  requestAnimationFrame(step);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function robot(x, y) {
  ctx.fillStyle = '#1d4e86';
  roundRect(x - 11, y - 8, 22, 26, 6); ctx.fill();
  ctx.fillStyle = '#3aa0ff';
  ctx.beginPath(); ctx.arc(x, y - 16, 12, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd36a'; ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#7cf0ff';
  ctx.beginPath(); ctx.arc(x - 4, y - 16, 2.2, 0, Math.PI * 2); ctx.arc(x + 4, y - 16, 2.2, 0, Math.PI * 2); ctx.fill();
}

function crystal(x, y) {
  ctx.fillStyle = '#3ecbff';
  ctx.beginPath();
  ctx.moveTo(x, y - 16); ctx.lineTo(x + 11, y); ctx.lineTo(x, y + 16); ctx.lineTo(x - 11, y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ffd36a'; ctx.lineWidth = 2; ctx.stroke();
}

function ring(x, y, r, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
}

function button(x, y, w, h, fill, label) {
  ctx.fillStyle = fill;
  roundRect(x, y, w, h, 14); ctx.fill();
  ctx.fillStyle = '#0d1b2a';
  ctx.font = '700 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + 28);
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  const sky = ctx.createLinearGradient(0, 0, 0, CH);
  sky.addColorStop(0, mode === 'roll' ? '#12082a' : '#142033');
  sky.addColorStop(1, '#070b14');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, CW, CH);

  if (mode === 'fork') {
    robot(CW / 2, 150);
    ctx.fillStyle = '#fff'; ctx.font = '700 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(T[lang].fork, CW / 2, 48);
    button(30, 250, 200, 48, '#1aa6c9', T[lang].maze);
    button(30, 320, 200, 48, '#ffd36a', T[lang].roll);
    return;
  }
  if (mode === 'maze') {
    ring(42, 42, 20, '#7ce7ff');
    ctx.fillStyle = '#1a4e86';
    MAZE_WALLS.forEach(w => { roundRect(w.x, w.y, w.w, w.h, 4); ctx.fill(); });
    ctx.fillStyle = '#ffd36a';
    MAZE_WALLS.forEach(w => ctx.fillRect(w.x, w.y, w.w, 3));
    robot(peak.x, peak.y);
  }
  if (mode === 'roll') {
    ring(nest.x, nest.y, nest.r, '#ffd36a');
    rocks.forEach(rock => {
      ctx.fillStyle = '#c46a3a';
      ctx.beginPath(); ctx.arc(rock.x, rock.y, rock.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7ce7ff'; ctx.lineWidth = 2; ctx.stroke();
    });
    crystal(gem.x, gem.y);
  }
  if (mode === 'win') {
    ring(CW / 2, 150, 54, '#ffd36a');
    ring(CW / 2, 150, 36, '#7ce7ff');
    ctx.fillStyle = '#ffd36a'; ctx.font = '700 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(winLine, CW / 2, 250);
    button(30, 320, 200, 48, '#1aa6c9', T[lang].back);
  }
}

function openMode(next) {
  mode = next;
  tiltX = 0; tiltY = 0;
  if (next === 'maze') resetMaze();
  if (next === 'roll') resetRoll();
}

function hitButton(x, y, bx, by, w, h) {
  return x >= bx && x <= bx + w && y >= by && y <= by + h;
}

function canvasPoint(e) {
  const rect = cv.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * CW / rect.width,
    y: (e.clientY - rect.top) * CH / rect.height
  };
}

function pressScreen(e) {
  const {x, y} = canvasPoint(e);
  if (mode === 'fork') {
    if (hitButton(x, y, 30, 250, 200, 48)) openMode('maze');
    if (hitButton(x, y, 30, 320, 200, 48)) openMode('roll');
    return;
  }
  if (mode === 'win') {
    if (hitButton(x, y, 30, 320, 200, 48)) openMode('fork');
    return;
  }
  drag = true;
  cv.classList.add('held');
  if (e.pointerId != null && cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  aim(e);
}

cv.addEventListener('pointerdown', pressScreen);
cv.addEventListener('click', e => {
  if (mode === 'fork' || mode === 'win') pressScreen(e);
});
cv.addEventListener('pointermove', e => { if (drag) aim(e); });
function release() {
  drag = false;
  cv.classList.remove('held');
  if (!arrow) { tiltX = 0; tiltY = 0; }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

function aim(e) {
  const rect = cv.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
  const len = Math.hypot(x, y) || 1;
  const power = Math.min(1, len * 1.5);
  tiltX = x / len * power;
  tiltY = y / len * power;
}

function holdArrow(name, x, y) {
  const btn = document.getElementById(name);
  const start = e => {
    e.preventDefault();
    arrow = name;
    btn.classList.add('on');
    tiltX = x; tiltY = y;
  };
  const stop = () => {
    if (arrow !== name) return;
    arrow = null;
    btn.classList.remove('on');
    if (!drag) { tiltX = 0; tiltY = 0; }
  };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
}
holdArrow('left', -1, 0);
holdArrow('right', 1, 0);
holdArrow('up', 0, -1);
holdArrow('down', 0, 1);

requestAnimationFrame(step);
</script>
</body>
</html>
